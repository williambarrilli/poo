<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cliente HTTP</title>
    <style>
        :root { color-scheme: dark; font-family: Arial, sans-serif; }
        * { box-sizing: border-box; }
        body { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0; background: #111827; color: #e5e7eb; }
        h1 { margin: 0 0 6px; }
        p { color: #9ca3af; }
        .layout { display: grid; grid-template-columns: 1fr; gap: 16px; }
        form { display: grid; gap: 12px; padding: 18px; background: #1f2937; border-radius: 10px; }
        .url { display: grid; grid-template-columns: 1fr; gap: 12px; }
        label { display: grid; min-width: 0; gap: 5px; color: #d1d5db; font-size: .9rem; }
        input, select, textarea, button { min-width: 0; border: 1px solid #4b5563; border-radius: 6px; padding: 10px; background: #111827; color: #f9fafb; font: inherit; }
        input, select, textarea { width: 100%; }
        textarea { min-height: 110px; resize: vertical; font-family: monospace; }
        button { cursor: pointer; background: #2563eb; border-color: #2563eb; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        button:disabled, textarea:disabled { opacity: .5; cursor: not-allowed; }
        .result { min-width: 0; padding: 18px; background: #1f2937; border-radius: 10px; }
        #status { margin: 0 0 8px; font-weight: bold; }
        #status.ok { color: #4ade80; }
        #status.error { color: #fb7185; }
        pre { min-height: 240px; max-height: 600px; overflow: auto; margin: 0; padding: 14px; background: #030712; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
        code { color: #93c5fd; }
        @media (max-width: 650px) {
            body { width: calc(100% - 32px); padding: 16px 0; }
        }
    </style>
</head>

<body>
    <h1>Cliente HTTP</h1>
    <p>Informe os dados da requisição para testar qualquer API acessível pelo navegador.</p>

    <main class="layout">
        <form id="requestForm">
            <div class="url">
                <label>URL base
                    <input id="baseUrl" type="url" value="http://localhost:3000" required>
                </label>
                <label>Endpoint
                    <input id="endpoint" value="/tarefas" placeholder="/usuarios/1">
                </label>
                <label>Método
                    <select id="method">
                        <option>GET</option>
                        <option>POST</option>
                        <option>PUT</option>
                        <option>PATCH</option>
                        <option>DELETE</option>
                        <option>OPTIONS</option>
                    </select>
                </label>
            </div>

            <label>Cabeçalhos JSON (opcional)
                <textarea id="headers" placeholder='{"Authorization":"Bearer seu-token"}'></textarea>
            </label>

            <label id="bodyLabel">Corpo JSON (opcional)
                <textarea id="body" placeholder='{"nome":"Maria"}'></textarea>
            </label>

            <button type="submit" id="sendButton">Enviar requisição</button>
        </form>

        <section class="result">
            <div id="status">Aguardando requisição</div>
            <pre id="response">A resposta aparecerá aqui.</pre>
        </section>
    </main>

    <script>
        const form = document.querySelector("#requestForm");
        const baseUrl = document.querySelector("#baseUrl");
        const endpoint = document.querySelector("#endpoint");
        const method = document.querySelector("#method");
        const headersInput = document.querySelector("#headers");
        const bodyInput = document.querySelector("#body");
        const bodyLabel = document.querySelector("#bodyLabel");
        const status = document.querySelector("#status");
        const responseOutput = document.querySelector("#response");
        const sendButton = document.querySelector("#sendButton");

        function hasBody() {
            return !["GET", "DELETE", "OPTIONS"].includes(method.value);
        }

        function updateBodyField() {
            const enabled = hasBody();
            bodyLabel.hidden = !enabled;
            bodyInput.disabled = !enabled;
        }

        function makeUrl() {
            const base = baseUrl.value.trim().replace(/\/+$/, "");
            const path = endpoint.value.trim().replace(/^\/+/, "");

            if (!base) throw new Error("Informe a URL base.");
            return path ? `${base}/${path}` : base;
        }

        function parseJson(value, fieldName) {
            if (!value.trim()) return {};
            try {
                return JSON.parse(value);
            } catch {
                throw new Error(`${fieldName} precisa ser um JSON válido.`);
            }
        }

        function showResponse(data) {
            responseOutput.textContent = typeof data === "string"
                ? data
                : JSON.stringify(data, null, 2);
        }

        async function sendRequest(event) {
            event.preventDefault();
            let url;

            try {
                url = makeUrl();
                const headers = parseJson(headersInput.value, "Cabeçalhos");
                const options = { method: method.value, headers };

                if (hasBody() && bodyInput.value.trim()) {
                    options.body = JSON.stringify(parseJson(bodyInput.value, "Corpo"));
                    if (!options.headers["Content-Type"] && !options.headers["content-type"]) {
                        options.headers["Content-Type"] = "application/json";
                    }
                }

                status.className = "";
                status.textContent = `Enviando ${method.value} ${url}...`;
                sendButton.disabled = true;

                const response = await fetch(url, options);
                const text = await response.text();
                let data = text;

                try { data = text ? JSON.parse(text) : "(resposta sem conteúdo)"; } catch { }

                status.className = response.ok ? "ok" : "error";
                status.textContent = `${response.status} ${response.statusText}`;
                showResponse(data);
            } catch (error) {
                status.className = "error";
                status.textContent = "Erro na requisição";
                showResponse({ erro: error.message, url });
            } finally {
                sendButton.disabled = false;
            }
        }

        method.addEventListener("change", updateBodyField);
        form.addEventListener("submit", sendRequest);
        updateBodyField();
    </script>
</body>

</html>
